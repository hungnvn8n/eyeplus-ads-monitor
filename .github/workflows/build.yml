name: Build installers

on:
  push:
    tags: ['v*']     # build khi push tag v1.0.0, v1.1.0, etc.
  workflow_dispatch:  # cho phép trigger manual từ GitHub UI

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0 Pillow
      - name: Build .dmg
        run: |
          source venv/bin/activate
          chmod +x build_mac.sh
          ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EyePlus-Ads-Mac
          path: installer/EyePlus-Ads-*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          python -m venv venv
          venv\Scripts\activate
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0 Pillow
        shell: cmd
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: |
          venv\Scripts\activate
          pyinstaller --clean fb_ad_local.spec
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\win_installer.iss
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: EyePlus-Ads-Windows
          path: installer/EyePlusAds-Setup-*.exe

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            EyePlus-Ads-Mac/*.dmg
            EyePlus-Ads-Windows/*.exe
          generate_release_notes: true
