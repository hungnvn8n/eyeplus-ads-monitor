name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # cho phép action-gh-release tạo release

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0 Pillow
      - name: Inject bundled FB tokens
        env:
          FB_TOKEN_BM1: ${{ secrets.FB_TOKEN_BM1 }}
          FB_TOKEN_BM2: ${{ secrets.FB_TOKEN_BM2 }}
          FB_TOKEN_BM3: ${{ secrets.FB_TOKEN_BM3 }}
        run: |
          python -c "
          import os
          tokens = {k: os.environ.get(k, '') for k in ['FB_TOKEN_BM1','FB_TOKEN_BM2','FB_TOKEN_BM3']}
          assert all(tokens.values()), 'Missing one of FB_TOKEN_BM1/2/3 in repo secrets'
          with open('_bundled_secrets.py', 'w', encoding='utf-8') as f:
              f.write('BUNDLED_TOKENS = {\n')
              for k, v in tokens.items():
                  f.write(f'    {k!r}: {v!r},\n')
              f.write('}\n')
          print('✅ _bundled_secrets.py generated')
          "
      - name: Build .dmg
        run: |
          source venv/bin/activate
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: List output
        run: ls -lh installer/
      - uses: actions/upload-artifact@v4
        with:
          name: EyePlus-Ads-Mac
          path: installer/EyePlus-Ads-*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install Python deps (system Python, no venv)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0 Pillow

      - name: Inject bundled FB tokens
        env:
          FB_TOKEN_BM1: ${{ secrets.FB_TOKEN_BM1 }}
          FB_TOKEN_BM2: ${{ secrets.FB_TOKEN_BM2 }}
          FB_TOKEN_BM3: ${{ secrets.FB_TOKEN_BM3 }}
        shell: bash
        run: |
          python -c "
          import os
          tokens = {k: os.environ.get(k, '') for k in ['FB_TOKEN_BM1','FB_TOKEN_BM2','FB_TOKEN_BM3']}
          assert all(tokens.values()), 'Missing one of FB_TOKEN_BM1/2/3 in repo secrets'
          with open('_bundled_secrets.py', 'w', encoding='utf-8') as f:
              f.write('BUNDLED_TOKENS = {\n')
              for k, v in tokens.items():
                  f.write(f'    {k!r}: {v!r},\n')
              f.write('}\n')
          print('OK _bundled_secrets.py generated')
          "

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: PyInstaller build .exe
        run: |
          pyinstaller --clean fb_ad_local.spec
          dir dist
        shell: cmd

      - name: Compile installer with Inno Setup
        run: |
          if not exist installer mkdir installer
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q installer\win_installer.iss
          dir installer
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: EyePlus-Ads-Windows
          path: installer/EyePlusAds-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: List downloaded artifacts
        run: ls -R
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EyePlus-Ads-Mac/*.dmg
            EyePlus-Ads-Windows/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
