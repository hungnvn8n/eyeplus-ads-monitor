{% extends "_base.html" %}
{% block title %}Log chỉnh Ads{% endblock %}

{% block content %}
<div class="px-4 py-6 max-w-6xl mx-auto">

  <!-- Header -->
  <div class="mb-6 flex items-center justify-between flex-wrap gap-3">
    <div>
      <div class="eyebrow mb-1">DIGITAL TEAM</div>
      <h1 class="text-xl font-bold text-white">Log chỉnh sửa Ads</h1>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Filter người -->
      <div class="flex rounded-lg overflow-hidden border border-white/[.08]" style="background: var(--surface);">
        <button onclick="setFilter('person','all')" id="btn-person-all"
                class="px-3 py-1.5 text-xs font-medium transition-colors person-btn active-person">
          Tất cả
        </button>
        <button onclick="setFilter('person','Tùng')" id="btn-person-Tùng"
                class="px-3 py-1.5 text-xs font-medium transition-colors person-btn border-l border-white/[.08]">
          Tùng
        </button>
        <button onclick="setFilter('person','Đạt')" id="btn-person-Đạt"
                class="px-3 py-1.5 text-xs font-medium transition-colors person-btn border-l border-white/[.08]">
          Đạt
        </button>
        <button onclick="setFilter('person','Hưng')" id="btn-person-Hưng"
                class="px-3 py-1.5 text-xs font-medium transition-colors person-btn border-l border-white/[.08]">
          Hưng
        </button>
        <button onclick="setFilter('person','Thắng')" id="btn-person-Thắng"
                class="px-3 py-1.5 text-xs font-medium transition-colors person-btn border-l border-white/[.08]">
          Thắng
        </button>
      </div>
      <!-- Ẩn thao tác bot/hệ thống (eyeplusbot, boteyeplus, Meta...) -->
      <button id="btn-hide-bot" onclick="toggleHideBot()"
              class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors border border-white/[.08] text-slate-400 hover:text-white"
              style="background: var(--surface);">
        Ẩn bot
      </button>
      <!-- Filter ngày -->
      <select id="days-select" onchange="reload()"
              class="px-3 py-1.5 rounded-lg text-xs text-white border border-white/[.08] outline-none"
              style="background: var(--surface);">
        <option value="7">7 ngày</option>
        <option value="14">14 ngày</option>
        <option value="30" selected>30 ngày</option>
        <option value="60">60 ngày</option>
      </select>
    </div>
  </div>

  <!-- Platform tabs -->
  <div class="flex gap-1 mb-5 border-b border-white/[.06]">
    <button onclick="setTab('all')" id="tab-all"
            class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors tab-btn active-tab">
      Tất cả
    </button>
    <button onclick="setTab('FB')" id="tab-FB"
            class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors tab-btn">
      Facebook
    </button>
    <button onclick="setTab('TikTok')" id="tab-TikTok"
            class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors tab-btn">
      TikTok
    </button>
  </div>

  <!-- TikTok manual log form (chỉ hiện khi tab TikTok) -->
  <div id="tiktok-form" class="hidden mb-5 rounded-2xl border border-white/[.07] p-5" style="background: var(--surface);">
    <div class="text-xs mono text-slate-500 mb-3 uppercase tracking-wider">Thêm log TikTok thủ công</div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
      <div>
        <label class="text-xs text-slate-400 mb-1 block">Ngày</label>
        <input type="date" id="tt-date" class="w-full px-2 py-1.5 rounded-lg text-sm text-white border border-white/[.08] outline-none focus:border-blue-500/50" style="background: var(--surface-3);">
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1 block">Người</label>
        <select id="tt-person" class="w-full px-2 py-1.5 rounded-lg text-sm text-white border border-white/[.08] outline-none" style="background: var(--surface-3);">
          <option value="Đạt">Đạt</option>
          <option value="Tùng">Tùng</option>
          <option value="Hưng">Hưng</option>
          <option value="Thắng">Thắng</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1 block">Hành động</label>
        <select id="tt-action" class="w-full px-2 py-1.5 rounded-lg text-sm text-white border border-white/[.08] outline-none" style="background: var(--surface-3);">
          <option value="TĂNG NS">TĂNG NS</option>
          <option value="GIẢM NS">GIẢM NS</option>
          <option value="TẠM DỪNG">TẠM DỪNG</option>
          <option value="BẬT LẠI">BẬT LẠI</option>
          <option value="TẠO MỚI">TẠO MỚI</option>
          <option value="CHỈNH NHẮM">CHỈNH NHẮM</option>
          <option value="CHỈNH CREATIVE">CHỈNH CREATIVE</option>
          <option value="KHÁC">KHÁC</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1 block">Campaign</label>
        <input type="text" id="tt-campaign" placeholder="Tên campaign..." class="w-full px-2 py-1.5 rounded-lg text-sm text-white border border-white/[.08] outline-none focus:border-blue-500/50" style="background: var(--surface-3);">
      </div>
    </div>
    <div class="flex gap-2">
      <input type="text" id="tt-detail" placeholder="Chi tiết thay đổi (VD: 200k → 350k)..."
             class="flex-1 px-3 py-1.5 rounded-lg text-sm text-white border border-white/[.08] outline-none focus:border-blue-500/50"
             style="background: var(--surface-3);"
             onkeydown="if(event.key==='Enter') addTikTokLog()">
      <button onclick="addTikTokLog()"
              class="px-4 py-1.5 rounded-lg text-sm font-medium text-white transition-colors flex items-center gap-1.5"
              style="background: rgba(99,102,241,0.25); border: 1px solid rgba(99,102,241,0.35);">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
        </svg>
        Thêm
      </button>
    </div>
  </div>

  <!-- Bộ lọc theo loại hành động -->
  <div class="flex items-center gap-1.5 mb-4 flex-wrap" id="action-filter">
    <span class="text-xs text-slate-500 mr-1">Hành động:</span>
  </div>

  <!-- Stats bar -->
  <div id="stats-bar" class="flex gap-4 mb-4 text-xs text-slate-400 hidden">
    <span id="stat-total"></span>
    <span>·</span>
    <span id="stat-tung"></span>
    <span>·</span>
    <span id="stat-dat"></span>
    <span>·</span>
    <span id="stat-hung"></span>
    <span>·</span>
    <span id="stat-thang"></span>
  </div>

  <!-- Log table -->
  <div id="log-container">
    <div class="flex items-center justify-center py-12 text-slate-500 text-sm">
      <div class="animate-spin w-5 h-5 border-2 border-white/20 border-t-violet-400 rounded-full mr-3"></div>
      Đang tải...
    </div>
  </div>

</div>

<style>
.active-tab { border-color: #a78bfa; color: #a78bfa; }
.tab-btn:not(.active-tab) { border-color: transparent; color: #94a3b8; }
.tab-btn:not(.active-tab):hover { color: #e2e8f0; }
.active-person { background: rgba(139,92,246,0.2); color: #c4b5fd; }
.person-btn:not(.active-person) { color: #94a3b8; }
.person-btn:not(.active-person):hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }

.action-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 600;
  font-family: monospace;
  white-space: nowrap;
}
.badge-len { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
.badge-tang { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.badge-giam { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.badge-tam-dung { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
.badge-bat-lai { background: rgba(6,182,212,0.15); color: #22d3ee; border: 1px solid rgba(6,182,212,0.3); }
.badge-khac { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }

.platform-fb { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.platform-tt { background: rgba(236,72,153,0.15); color: #f472b6; border: 1px solid rgba(236,72,153,0.3); }
.src-tool { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); }
.src-fb { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }

.person-tung { color: #a78bfa; }
.person-dat { color: #34d399; }
.person-hung { color: #fb923c; }
.person-thang { color: #22d3ee; }
</style>

<script>
let currentTab = 'all';
let currentPerson = 'all';
let hideBot = false;
let lastEntries = [];

const BOT_NAMES = ['eyeplusbot', 'boteyeplus', 'meta'];
function isBot(e) {
  const p = (e.person || '').toLowerCase();
  return BOT_NAMES.includes(p) || p.includes('bot');
}

function toggleHideBot() {
  hideBot = !hideBot;
  const b = document.getElementById('btn-hide-bot');
  b.classList.toggle('active-person', hideBot);
  b.textContent = hideBot ? '✓ Đã ẩn bot' : 'Ẩn bot';
  renderLog(lastEntries);
}

// ── Bộ lọc theo loại hành động (trạng thái) ──
let currentAction = 'all';
const ACTION_FILTERS = [
  ['all', 'Tất cả'],
  ['LÊN CAM MỚI', 'Lên cam mới'],
  ['LÊN NHÓM QC', 'Lên nhóm QC'],
  ['LÊN AD MỚI', 'Lên ad mới'],
  ['BẬT LẠI', 'Bật'],
  ['TẠM DỪNG', 'Tắt / Dừng'],
  ['TĂNG NS', 'Tăng NS'],
  ['GIẢM NS', 'Giảm NS'],
  ['KHÁC', 'Khác'],
];
const MAIN_ACTIONS = ACTION_FILTERS.map(a => a[0]).filter(a => a !== 'all' && a !== 'KHÁC');

function buildActionFilter() {
  const wrap = document.getElementById('action-filter');
  wrap.innerHTML = '<span class="text-xs text-slate-500 mr-1">Hành động:</span>' +
    ACTION_FILTERS.map(([val, lbl]) =>
      `<button onclick="setActionFilter('${val}')" data-action="${val}"
        class="action-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors border border-white/[.08] ${val === currentAction ? 'active-person' : 'text-slate-400 hover:text-white'}"
        style="background: var(--surface);">${lbl}</button>`).join('');
}

function setActionFilter(val) {
  currentAction = val;
  buildActionFilter();
  renderLog(lastEntries);
}

function matchAction(e) {
  if (currentAction === 'all') return true;
  const a = (e.action || '').toUpperCase();
  // Tool dùng tên hơi khác: TẮT ~ TẠM DỪNG, TẠO MỚI ~ LÊN CAM MỚI
  if (currentAction === 'TẠM DỪNG') return a.includes('TẠM DỪNG') || a.includes('TẮT') || a.includes('PAUSE');
  if (currentAction === 'LÊN CAM MỚI') return a.includes('LÊN CAM MỚI') || a.includes('TẠO MỚI');
  if (currentAction === 'KHÁC') return !MAIN_ACTIONS.some(m => a.includes(m)) && !a.includes('TẮT') && !a.includes('TẠO MỚI');
  return a.includes(currentAction);
}
document.addEventListener('DOMContentLoaded', buildActionFilter);

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
  document.getElementById('tab-' + tab).classList.add('active-tab');
  document.getElementById('tiktok-form').classList.toggle('hidden', tab !== 'TikTok');
  reload();
}

function setFilter(type, val) {
  if (type === 'person') {
    currentPerson = val;
    document.querySelectorAll('.person-btn').forEach(b => b.classList.remove('active-person'));
    document.getElementById('btn-person-' + val).classList.add('active-person');
  }
  reload();
}

async function reload() {
  const days = document.getElementById('days-select').value;
  const platform = currentTab === 'all' ? 'all' : currentTab;
  const person = currentPerson;
  const url = `/api/ads-change-log?days=${days}&platform=${encodeURIComponent(platform)}&person=${encodeURIComponent(person)}`;

  document.getElementById('log-container').innerHTML = `
    <div class="flex items-center justify-center py-12 text-slate-500 text-sm">
      <div class="animate-spin w-5 h-5 border-2 border-white/20 border-t-violet-400 rounded-full mr-3"></div>
      Đang tải...
    </div>`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Lỗi server');
    renderLog(data.entries);
  } catch (e) {
    document.getElementById('log-container').innerHTML =
      `<div class="text-center py-12 text-rose-400 text-sm">Lỗi: ${e.message}</div>`;
  }
}

function actionBadge(action) {
  const a = (action || '').toUpperCase();
  let cls = 'badge-khac';
  if (a.includes('LÊN') || a.includes('TẠO MỚI')) cls = 'badge-len';
  else if (a.includes('TĂNG') || a.includes('SCALE')) cls = 'badge-tang';
  else if (a.includes('GIẢM')) cls = 'badge-giam';
  else if (a.includes('TẠM DỪNG') || a.includes('PAUSE') || a.includes('DỪNG')) cls = 'badge-tam-dung';
  else if (a.includes('BẬT') || a.includes('RESUME') || a.includes('MỞ')) cls = 'badge-bat-lai';
  return `<span class="action-badge ${cls}">${action}</span>`;
}

function platformBadge(platform) {
  const cls = platform === 'FB' ? 'platform-fb' : 'platform-tt';
  return `<span class="action-badge ${cls}">${platform === 'FB' ? 'Facebook' : 'TikTok'}</span>`;
}

function sourceBadge(e) {
  if (e.source === 'fb')
    return `<span class="action-badge src-fb" title="Từ FB Activity Log — mọi thao tác trên tài khoản, kể cả làm ngoài tool">FB log</span>`;
  return `<span class="action-badge src-tool" title="Thao tác thực hiện trong tool">Tool</span>`;
}

function personLabel(person) {
  const cls = person === 'Tùng' ? 'person-tung'
            : person === 'Đạt' ? 'person-dat'
            : person === 'Hưng' ? 'person-hung'
            : person === 'Thắng' ? 'person-thang'
            : 'text-slate-300';
  return `<span class="font-medium ${cls}">${person}</span>`;
}

function renderLog(entries) {
  lastEntries = entries;
  if (hideBot) entries = entries.filter(e => !isBot(e));
  entries = entries.filter(matchAction);
  const statsBar = document.getElementById('stats-bar');

  if (!entries.length) {
    statsBar.classList.add('hidden');
    document.getElementById('log-container').innerHTML = `
      <div class="text-center py-16 text-slate-500">
        <svg class="w-10 h-10 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/>
        </svg>
        <div class="text-sm">Không có log nào trong khoảng thời gian này</div>
      </div>`;
    return;
  }

  const tung = entries.filter(e => e.person === 'Tùng').length;
  const dat = entries.filter(e => e.person === 'Đạt').length;
  const hung = entries.filter(e => e.person === 'Hưng').length;
  const thang = entries.filter(e => e.person === 'Thắng').length;
  statsBar.classList.remove('hidden');
  document.getElementById('stat-total').textContent = `${entries.length} thay đổi`;
  document.getElementById('stat-tung').innerHTML = `<span class="person-tung">Tùng</span>: ${tung}`;
  document.getElementById('stat-dat').innerHTML = `<span class="person-dat">Đạt</span>: ${dat}`;
  document.getElementById('stat-hung').innerHTML = `<span class="person-hung">Hưng</span>: ${hung}`;
  document.getElementById('stat-thang').innerHTML = `<span class="person-thang">Thắng</span>: ${thang}`;

  const byDate = {};
  entries.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
  let html = '';

  for (const d of dates) {
    const items = byDate[d];
    const [y, m, day] = d.split('-');
    const dateLabel = `${day}/${m}/${y}`;

    html += `
    <div class="mb-5">
      <div class="flex items-center gap-2 mb-2">
        <div class="text-xs font-semibold text-slate-300 mono">${dateLabel}</div>
        <div class="text-xs text-slate-600">${items.length} thay đổi</div>
        <div class="flex-1 h-px bg-white/[.04]"></div>
      </div>
      <div class="rounded-xl overflow-hidden border border-white/[.06]" style="background: var(--surface);">
        <table class="w-full text-sm">`;

    items.forEach((e, i) => {
      const border = i > 0 ? 'border-t border-white/[.04]' : '';
      const regionHtml = e.region
        ? `<span class="text-xs text-slate-500 ml-1">${e.region}</span>`
        : '';
      const accHtml = e.account
        ? `<span class="text-xs text-slate-600 ml-1">· ${e.account}</span>`
        : '';
      const campaignHtml = e.campaign_name
        ? `<div class="text-xs text-slate-500 mt-0.5 truncate" style="max-width:340px">${e.campaign_name}${accHtml}</div>`
        : '';
      const detailHtml = e.detail && e.detail !== e.campaign_name
        ? `<div class="text-xs text-slate-400 mt-0.5">${e.detail}</div>`
        : '';
      const deleteBtn = e.platform === 'TikTok'
        ? `<button onclick="deleteTikTokEntry(${e.id})" class="text-slate-600 hover:text-rose-400 transition-colors text-xs px-1">✕</button>`
        : '';

      html += `
        <tr class="${border}">
          <td class="px-4 py-2.5 w-28">${platformBadge(e.platform)} ${sourceBadge(e)}</td>
          <td class="px-3 py-2.5 w-24">${personLabel(e.person)}${regionHtml}</td>
          <td class="px-3 py-2.5 w-32">${actionBadge(e.action)}</td>
          <td class="px-3 py-2.5 text-slate-300">
            ${campaignHtml}
            ${detailHtml}
          </td>
          <td class="px-2 py-2.5 w-8 text-right">${deleteBtn}</td>
        </tr>`;
    });

    html += `</table></div></div>`;
  }

  document.getElementById('log-container').innerHTML = html;
}

async function addTikTokLog() {
  const logDate = document.getElementById('tt-date').value;
  const person = document.getElementById('tt-person').value;
  const action = document.getElementById('tt-action').value;
  const detail = document.getElementById('tt-detail').value.trim();
  const campaign_name = document.getElementById('tt-campaign').value.trim();

  if (!logDate) { alert('Chọn ngày'); return; }

  const res = await fetch('/api/ads-change-log/tiktok', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({date: logDate, person, action, detail, campaign_name})
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('tt-detail').value = '';
    document.getElementById('tt-campaign').value = '';
    reload();
  } else {
    alert(data.error || 'Lỗi');
  }
}

async function deleteTikTokEntry(id) {
  if (!confirm('Xóa entry này?')) return;
  const res = await fetch(`/api/ads-change-log/tiktok/${id}`, {method: 'DELETE'});
  const data = await res.json();
  if (data.ok) reload();
}

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('tt-date').value = today;
  reload();
});
</script>
{% endblock %}
